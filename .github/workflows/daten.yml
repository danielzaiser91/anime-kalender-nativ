name: Daten und Veröffentlichung

# Stündlich per workflow_dispatch vom Cloudflare-Wecker des Hauptrepos (kein GitHub-Zeitplan: Abschaltung nach 60 Ruhetagen,
# unpünktlich): fragt den Datenstand des Altrepos (öffentlich, ohne eigenes Token), baut dann nur bei neuem Stand,
# prüft Schema und Größen (bei Fehler kein Deploy) und veröffentlicht als Pages-Artefakt. Push auf main baut immer.
# Im Pull Request läuft derselbe Bau ohne Deploy. Daten werden nie ins Git dieses Repos geschrieben.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      erzwingen:
        description: 'Auch bei unverändertem Datenstand bauen und veröffentlichen'
        type: boolean
        default: false

concurrency:
  group: veroeffentlichen-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

env:
  ALTREPO: danielzaiser91/anime-kalender-de
  SEITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  bauen:
    name: Bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.vergleich.outputs.noetig == 'true' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Datenstand vergleichen
        id: vergleich
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$ALTREPO/commits?path=public/data&per_page=1" --jq '.[0].sha')
          test -n "$sha"
          laufend=$(curl -fsS "$SEITE/data/stand.json" | jq -r .quelle || echo keine)
          echo "Altrepo $sha, veröffentlicht $laufend, Ereignis ${{ github.event_name }}"
          noetig=true
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.erzwingen }}" != true ] && [ "$sha" = "$laufend" ]; then noetig=false; fi
          echo "noetig=$noetig" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Regelwächter
        if: steps.vergleich.outputs.noetig == 'true'
        run: node tools/wache.mjs
      - name: Wächter-Probe
        if: steps.vergleich.outputs.noetig == 'true'
        run: node tools/wache-probe.mjs
      - name: Daten des Altrepos holen
        if: steps.vergleich.outputs.noetig == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ALTREPO }}
          path: altrepo
          fetch-depth: 1
          sparse-checkout: |
            /public/data/
            /data/kennungen.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verdichten und Größen prüfen
        if: steps.vergleich.outputs.noetig == 'true'
        run: |
          mkdir _site
          cp -r index.html css js _site/
          node tools/verdichten.mjs altrepo _site/data "${{ steps.vergleich.outputs.sha }}"
          node tools/wache.mjs _site
      - name: Artefakt hochladen
        if: steps.vergleich.outputs.noetig == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    name: Pages
    needs: bauen
    if: needs.bauen.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
